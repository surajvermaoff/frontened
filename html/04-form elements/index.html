<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form element</title>
  </head>
  <body>
    <div style="background-color: hotpink;">
      <h1>form element</h1>
      <h1>youtube</h1>
      <form action="https://www.youtube.com/results">
        <label for="youtube">youtube search </label>
        <input
          id="youtube"
          type="text"
          name="search_query"
          placeholder="search for video"
        />
        <button>search on youtube</button>
      </form>
      <h1>flipkart</h1>
      <form action="https://www.flipkart.com/search">
        <label for="flipkart">flipkart search </label>
        <input
          id="flipkart"
          type="text"
          name="q"
          placeholder="search for products"
        />
        <button>sarch on flipkart</button>
      </form>
      <h2>google</h2>
      <form action="https://www.google.com/search">
        <input type="text" name="q" placeholder="search anything" />
        <button>search on google</button>
        <br>
       
      </form>
    </div>
    <h1 style="background-color: aquamarine;">html form</h1>
    <form action="/" style="background-color: burlywood" align="center">
      <label for="name">enter your name</label> <br />
      <input
        type="text "
        placeholder="enter name"
        id="name"
        style="background-color: honeydew"
      />
      <br /><label for="email">your gmail id</label> <br />
      <input
        type="email"
        placeholder="enter your gmail"
        id="email"
        style="background-color: honeydew"
      />
      <br />
      <label for="phone">your  phone</label><br />
      <input
        type="tel"
        placeholder="enter your phone"
        id="phone"
        style="background-color: honeydew"
      />
      <br>
      <label for="password">your password</label><br />
      <input
        type="password"
        placeholder="enter your password"
        id="password"
        style="background-color: honeydew"
      />
      <br/>
      
      <br><input type="checkbox" name="checkbox"  id="checkbox" required>
      <label for="checkbox">agree to terms and conditions</label> <br>
      
      <button type="submit" style="background-color: honeydew">submit</button>
      <button type="reset" style="background-color: honeydew">reset</button>

    </form>
  </body>
</html>
