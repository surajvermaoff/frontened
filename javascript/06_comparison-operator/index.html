    <h1>comparison operator</h1>
    <ul>
        <li>== /equal to (compares implicitely)</li>
        <li>=== /strict equal to (compares explicitely)</li>
        <li>!= /not equal to</li>
        <li>!== /strict not equal to</li>
        <li> >  /greater then  </li>
        <li> >= /greater than equal to</li>
        <li> < /less than </li>
        <li> <= /less than equal to </li>
    </ul>
